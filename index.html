<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Student Attendance Management System</h1>
        <p>Manage student attendance easily</p>
    </header>

    <main>

        <section class="card">
            <h2>Add Student</h2>

            <form id="studentForm">
                <input 
                    type="text" 
                    id="studentName" 
                    placeholder="Enter student name"
                    required
                >

                <input 
                    type="text" 
                    id="studentId" 
                    placeholder="Enter student ID"
                    required
                >

                <button type="submit">Add Student</button>
            </form>
        </section>

        <section class="card">
            <h2>Attendance</h2>

            <table>
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Student Name</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="studentList">
                    <!-- Students will appear here -->
                </tbody>
            </table>
        </section>

    </main>

    <footer>
        <p>Student Attendance Management System &copy; 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
